# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # DAOs are lists of queries; splitting them would only scatter related SQL.
    excludes: ['**/dao/**', '**/test/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**', '**/androidDeviceTest/**']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**', '**/androidDeviceTest/**', '**/theme/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 3
  WildcardImport:
    active: true
