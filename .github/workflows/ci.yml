name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The routine tool for AIs (tools/routine): no dependencies, the runner's Node is enough.
      - run: node --test tools/routine/test/routine.test.mjs
      # The benchmarks' results table (tools/benchmark); the benchmarks themselves need the phone.
      - run: node --test tools/benchmark/test/results.test.mjs

      # Unit + Robolectric tests, Spotless, detekt, Android Lint, and a debug APK.
      - run: ./gradlew check :app:android:assembleDebug

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
